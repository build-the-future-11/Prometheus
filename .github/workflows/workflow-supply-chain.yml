name: workflow-supply-chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-workflow-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPECTED_SOURCE_SHA" in
            (*[!0-9a-f]*|'') echo "invalid expected source SHA: $EXPECTED_SOURCE_SHA" >&2; exit 1 ;;
          esac
          test "${#EXPECTED_SOURCE_SHA}" -eq 40
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo "source mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual" >&2
            exit 1
          }
          printf 'SOURCE_SHA=%s\n' "$actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify workflow supply-chain contract
        run: python -m unittest discover -s tests -p 'test_workflow_supply_chain.py' -v
