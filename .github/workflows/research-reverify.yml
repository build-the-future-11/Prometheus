name: Platform-matched research verification
on:
  push:
    branches: ['research/portfolio-completion-20261022']
    paths: ['.github/workflows/research-reverify.yml', 'tools/research_reverify.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Fetch exact source without unresolved submodules
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'build-the-future-11/Prometheus'
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --no-tags --no-recurse-submodules origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15.0'
      - name: Install publication-only dependencies
        run: python -m pip install 'numpy==2.5.4' 'matplotlib==3.11.2'
      - name: Exact verification and disclosed-outcome reproduction
        run: python tools/research_reverify.py --output /tmp/research-reverified
      - name: Retain success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-matched-research
          path: /tmp/research-reverified/
          retention-days: 30
          if-no-files-found: warn
  publication:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Fetch exact source without submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --no-tags --no-recurse-submodules origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: platform-matched-research
          path: research-releases/2026-10-22-reverified
      - name: Verify downloaded evidence and compile manuscript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('research-releases/2026-10-22-reverified')
          for name,digest in json.loads((root/'artifact-manifest.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          state=json.loads((root/'completion.json').read_text())
          assert state['status']=='VERIFIED_SOURCE_READY_FOR_PDF_REVIEW'
          assert not state['new_blinded_confirmation']
          assert not state['kaggle_execution']
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended poppler-utils > /tmp/tex-install.log 2>&1
          cd research-releases/2026-10-22-reverified/paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > ../latex-pass-1.log 2>&1 || { tail -80 ../latex-pass-1.log; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > ../latex-pass-2.log 2>&1 || { tail -80 ../latex-pass-2.log; exit 1; }
          pdfinfo main.pdf
          pdftotext -bbox main.pdf ../paper-bbox.html
          pdftoppm -r 80 -png main.pdf ../review-page
      - name: Record QA and update scientific state without erasing history
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,shutil,xml.etree.ElementTree as ET
          root=pathlib.Path('research-releases/2026-10-22-reverified')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          xml=ET.parse(root/'paper-bbox.html')
          ns={'h':'http://www.w3.org/1999/xhtml'}
          pages=xml.findall('.//h:page',ns)
          outside=[]
          for i,page in enumerate(pages,1):
              width,height=float(page.attrib['width']),float(page.attrib['height'])
              for word in page.findall('.//h:word',ns):
                  a=word.attrib
                  if float(a['xMin']) < -1 or float(a['yMin']) < -1 or float(a['xMax']) > width+1 or float(a['yMax']) > height+1:
                      outside.append({'page':i,'word':word.text,'bbox':a})
          qa={'pages':len(pages),'off_page_words':outside,'rendered_pages':len(list(root.glob('review-page-*.png'))),'visual_inspection_complete':False,'pdf_sha256':sha(root/'paper/main.pdf')}
          (root/'PDF_QA.json').write_text(json.dumps(qa,indent=2)+'\n')
          assert pages and not outside,'PDF page boundary check failed'
          status_path=pathlib.Path('NEUROGENESIS/successors/memory_v4/STATUS.json')
          shutil.copy2(status_path,root/'PREVIOUS_NEUROGENESIS_STATUS.json')
          state=json.loads(status_path.read_text())
          state.update(utc=now,status='REPRODUCED_MIXED_SCOPE_LIMITED_PDF_VISUAL_REVIEW_PENDING',hosted_execution=True,hosted_platform='GitHub Actions; not Kaggle',remote_v4_publication=True,publication_scope='Research branch evidence package; no external submission')
          state['reproduction_20261022']={'release':str(root),'new_blinded_confirmation':False,'independent_investigator_replication':False,'kaggle_execution':False,'frozen_sources_unchanged':True,'real_streams':'MIXED','synthetic_exact_replay':str(root/'synthetic-verification-exact.json'),'prior_linux_failure':'research-releases/2026-10-22-attempt-01/memory-synthetic-artifact-reverification.log','pdf':str(root/'paper/main.pdf'),'visual_review_complete':False}
          status_path.write_text(json.dumps(state,indent=2)+'\n')
          md=pathlib.Path('NEUROGENESIS/RESEARCH_STATE.md')
          shutil.copy2(md,root/'PREVIOUS_NEUROGENESIS_RESEARCH_STATE.md')
          note='\n\n## 2026-10-22 evidence reconciliation\n\nCurrent disposition: MIXED, scope-limited computational reproduction. The old real-pending label was stale: the manuscript already contained Air and Beijing outcomes. Exact synthetic verification was repeated on macOS arm64 CPython 3.15.0 without changing frozen source or thresholds. The Linux task-identity failure is retained; cross-platform bitwise portability is not established. Both real streams were reproduced and exactly replayed. Air is worse than the selected baseline; Beijing is better than that baseline but worse than persistence. Evidence is at repository-root path '+str(root)+'. The PDF is compiled and rendered, with visual inspection and external scientific review still separate gates. No new Kaggle run, blinded confirmation, independent-investigator replication or external submission is claimed.\n'
          md.write_text(md.read_text()+note)
          rp=pathlib.Path('RESEARCH_PORTFOLIO_STATE.json')
          registry=json.loads(rp.read_text())
          for project in registry['projects']:
              if project['id']=='NEUROGENESIS':
                  project.update(scientific_state='REPRODUCED_MIXED_SCOPE_LIMITED',release=str(root),paper_state='COMPILED_RENDERED_VISUAL_REVIEW_PENDING',next_gate='Inspect all rendered pages and obtain scientific and authorship review; retain the cross-platform bitwise limitation.')
          rp.write_text(json.dumps(registry,indent=2)+'\n')
          report='# Research execution closeout — 22 October 2026\n\n205 tests passed across six actual project suites: AdaptivePredictive 25, Derived Learning 30, Materials Discovery 77, PI-ML 26, SPARKING 21 and NEUROGENESIS v4 26. Engineering success is not scientific efficacy. The Derived Learning test-loader bug is fixed and a new source bundle is hash-bound, while the original frozen S3 study is unchanged. No Kaggle upload or S3 execution occurred.\n\nNEUROGENESIS real streams were executed and exactly replayed: Air Quality has about 74.30% worse MSE despite 92.69% fewer solves; Beijing has 13.83% lower MSE versus its selected baseline and 65.34% fewer solves, but loses to last-observation persistence. These outcomes were already disclosed and are reproductions, not new blinded confirmations. The retained synthetic archive was exactly replayed on its numerical platform after Linux regeneration differed at roundoff. The failed Linux attempt remains preserved. The manuscript was regenerated from verified evidence using recovered arxiv.sty, compiled and rendered; visual-review status is in PDF_QA.json.\n\nRESEARCH_PORTFOLIO_STATE.json records every actual new-wave root. Four unresolved gitlinks and one source-missing project are not falsely marked implemented. AdaptivePredictive and SPARKING retain their negative findings and closed protected gates. Materials Discovery remains mixed development evidence. PI-ML retains direct-solver and OOD limitations. Existing histories, frozen sources and negative results remain preserved.\n\nAll work is on the research branch. No main merge, external submission, independent-investigator replication, new Kaggle run, trade, paid compute purchase or Worldcastr modification occurred. The whole portfolio is not scientifically complete.\n'
          pathlib.Path('RESEARCH_COMPLETION_2026-10-22.md').write_text(report)
          manifest={str(p.relative_to(root)):sha(p) for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'release-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(qa,indent=2))
          PY
      - name: Publish only evidence and named state records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/portfolio-completion-20261022'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git add -f -- research-releases/2026-10-22-reverified NEUROGENESIS/RESEARCH_STATE.md NEUROGENESIS/successors/memory_v4/STATUS.json RESEARCH_PORTFOLIO_STATE.json RESEARCH_COMPLETION_2026-10-22.md
          python3 - <<'PY'
          import subprocess
          allowed={'NEUROGENESIS/RESEARCH_STATE.md','NEUROGENESIS/successors/memory_v4/STATUS.json','RESEARCH_PORTFOLIO_STATE.json','RESEARCH_COMPLETION_2026-10-22.md'}
          for path in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              assert path in allowed or path.startswith('research-releases/2026-10-22-reverified/'),path
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Retain exact platform-matched evidence and regenerated manuscript; reconcile research state'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf 'PUBLISHED_COMMIT=%s\n' "$(git rev-parse HEAD)"
      - name: Retain manuscript and rendered review pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-manuscript-and-review
          path: |
            research-releases/2026-10-22-reverified/paper/
            research-releases/2026-10-22-reverified/review-page-*.png
            research-releases/2026-10-22-reverified/PDF_QA.json
            research-releases/2026-10-22-reverified/latex-pass-*.log
          retention-days: 30
          if-no-files-found: warn
