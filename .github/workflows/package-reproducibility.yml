name: package-reproducibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-package-repro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPECTED_SOURCE_SHA" in
            (*[!0-9a-f]*|'') echo "invalid expected source SHA: $EXPECTED_SOURCE_SHA" >&2; exit 1 ;;
          esac
          test "${#EXPECTED_SOURCE_SHA}" -eq 40
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo "source mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual" >&2
            exit 1
          }
          printf 'SOURCE_SHA=%s\n' "$actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify independent distribution reproducibility
        shell: bash
        run: |
          set -euo pipefail

          build_venv="$(mktemp -d)"
          archive="$(mktemp)"
          root="$(mktemp -d)"
          epoch="$(git show -s --format=%ct "$EXPECTED_SOURCE_SHA")"

          # Match the build-system floor declared by pyproject.toml. The separate
          # build-backend-floor workflow verifies the exact 77.x floor; this workflow
          # exercises reproducibility on the supported >=77 contract.
          python -m venv "$build_venv"
          "$build_venv/bin/python" -m pip install 'setuptools>=77'
          "$build_venv/bin/python" - <<'PY'
          import setuptools
          print(f"build_setuptools={setuptools.__version__}")
          PY

          # Every build starts from an independent extraction of the exact Git tree.
          git archive --format=tar "$EXPECTED_SOURCE_SHA" > "$archive"

          export SOURCE_DATE_EPOCH="$epoch"
          export PYTHONHASHSEED=0
          export TZ=UTC
          export LC_ALL=C.UTF-8

          build_artifact() {
            kind="$1"
            ordinal="$2"
            src="$root/${kind}-src-${ordinal}"
            out="$root/${kind}-out-${ordinal}"
            mkdir -p "$src" "$out"
            tar -xf "$archive" -C "$src"
            (
              cd "$src"
              KIND="$kind" OUT_DIR="$out" "$build_venv/bin/python" - <<'PY'
          import os
          import pathlib
          import setuptools.build_meta as backend

          kind = os.environ["KIND"]
          out_dir = pathlib.Path(os.environ["OUT_DIR"]).resolve()
          if kind == "wheel":
              filename = backend.build_wheel(str(out_dir))
          elif kind == "sdist":
              filename = backend.build_sdist(str(out_dir))
          else:
              raise SystemExit(f"unsupported build kind: {kind}")
          print(out_dir / filename)
          PY
            )
          }

          build_artifact wheel 1
          sleep 2
          build_artifact wheel 2
          build_artifact sdist 1
          sleep 2
          build_artifact sdist 2

          test "$(find "$root/wheel-out-1" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$root/wheel-out-2" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$root/sdist-out-1" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find "$root/sdist-out-2" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

          wheel1="$(find "$root/wheel-out-1" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          wheel2="$(find "$root/wheel-out-2" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist1="$(find "$root/sdist-out-1" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          sdist2="$(find "$root/sdist-out-2" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

          test "$(basename "$wheel1")" = "$(basename "$wheel2")"
          test "$(basename "$sdist1")" = "$(basename "$sdist2")"

          sha256sum "$wheel1" "$wheel2" "$sdist1" "$sdist2"

          # Wheels honor SOURCE_DATE_EPOCH under the current build backend, so require
          # the strongest byte-for-byte contract here.
          if ! cmp -s "$wheel1" "$wheel2"; then
            echo "independent wheel builds are not byte-for-byte reproducible" >&2
            exit 1
          fi

          # setuptools sdists retain archive/header mtimes that are not controlled by
          # SOURCE_DATE_EPOCH. Do not pretend the compressed wrapper is reproducible;
          # instead require the complete logical archive payload (paths, types, modes,
          # link targets and regular-file bytes) to be identical. Generated metadata
          # bytes remain part of this comparison, so content drift still fails closed.
          WHEEL1="$wheel1" WHEEL2="$wheel2" SDIST1="$sdist1" SDIST2="$sdist2" \
            "$build_venv/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tarfile
          import zipfile

          wheel1 = pathlib.Path(os.environ["WHEEL1"])
          wheel2 = pathlib.Path(os.environ["WHEEL2"])
          sdist1 = pathlib.Path(os.environ["SDIST1"])
          sdist2 = pathlib.Path(os.environ["SDIST2"])

          def wheel_files(path):
              with zipfile.ZipFile(path) as archive:
                  files = sorted(name for name in archive.namelist() if not name.endswith("/"))
                  if not files:
                      raise SystemExit("wheel contains no files")
                  return files

          if wheel_files(wheel1) != wheel_files(wheel2):
              raise SystemExit("independent wheel file sets differ")

          def safe_path(name):
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"unsafe sdist member path: {name}")
              return path

          def safe_link(member):
              target = pathlib.PurePosixPath(member.linkname)
              if target.is_absolute() or ".." in target.parts:
                  raise SystemExit(
                      f"unsafe sdist link target: {member.name} -> {member.linkname}"
                  )

          def logical_sdist(path):
              entries = []
              with tarfile.open(path, "r:gz") as archive:
                  for member in archive.getmembers():
                      safe_path(member.name)
                      base = {
                          "name": member.name,
                          "mode": member.mode,
                      }
                      if member.isfile():
                          stream = archive.extractfile(member)
                          if stream is None:
                              raise SystemExit(f"failed to read sdist member: {member.name}")
                          payload = stream.read()
                          base.update(
                              kind="file",
                              size=len(payload),
                              sha256=hashlib.sha256(payload).hexdigest(),
                          )
                      elif member.isdir():
                          base.update(kind="dir")
                      elif member.issym():
                          safe_link(member)
                          base.update(kind="symlink", linkname=member.linkname)
                      elif member.islnk():
                          safe_link(member)
                          base.update(kind="hardlink", linkname=member.linkname)
                      else:
                          raise SystemExit(
                              f"unsupported special sdist member: {member.name} type={member.type!r}"
                          )
                      entries.append(base)

              if not any(entry["kind"] == "file" for entry in entries):
                  raise SystemExit("source distribution contains no regular files")
              entries.sort(key=lambda entry: (entry["name"], entry["kind"]))
              canonical = json.dumps(
                  entries,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              return entries, hashlib.sha256(canonical).hexdigest()

          entries1, logical_sha1 = logical_sdist(sdist1)
          entries2, logical_sha2 = logical_sdist(sdist2)
          if entries1 != entries2:
              by_name1 = {entry["name"]: entry for entry in entries1}
              by_name2 = {entry["name"]: entry for entry in entries2}
              names = sorted(set(by_name1) | set(by_name2))
              drift = [
                  name
                  for name in names
                  if by_name1.get(name) != by_name2.get(name)
              ]
              raise SystemExit(f"independent sdist logical payload drift: {drift}")

          print(f"wheel_files={len(wheel_files(wheel1))}")
          print(f"wheel_sha256={hashlib.sha256(wheel1.read_bytes()).hexdigest()}")
          print(f"sdist_entries={len(entries1)}")
          print(f"sdist_logical_sha256={logical_sha1}")
          print(
              "sdist_archive_byte_reproducible="
              + str(sdist1.read_bytes() == sdist2.read_bytes()).lower()
          )
          print(
              f"sdist_archive_sha256_1={hashlib.sha256(sdist1.read_bytes()).hexdigest()}"
          )
          print(
              f"sdist_archive_sha256_2={hashlib.sha256(sdist2.read_bytes()).hexdigest()}"
          )
          PY

          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo "PASS_INDEPENDENT_DISTRIBUTION_REPRODUCIBILITY"
