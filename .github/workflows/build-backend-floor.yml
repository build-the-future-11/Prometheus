name: build-backend-floor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-build-backend-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPECTED_SOURCE_SHA" in
            (*[!0-9a-f]*|'') echo "invalid expected source SHA: $EXPECTED_SOURCE_SHA" >&2; exit 1 ;;
          esac
          test "${#EXPECTED_SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify declared build-backend floor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          requires = config.get("build-system", {}).get("requires")
          backend = config.get("build-system", {}).get("build-backend")
          if requires != ["setuptools>=77"]:
              raise SystemExit(f"unexpected build-system.requires: {requires!r}")
          if backend != "setuptools.build_meta":
              raise SystemExit(f"unexpected build backend: {backend!r}")
          print("declared_build_requirement=setuptools>=77")
          print("declared_build_backend=setuptools.build_meta")
          PY

      - name: Build at the declared setuptools major floor
        shell: bash
        run: |
          set -euo pipefail
          build_venv="$(mktemp -d)"
          wheel_dir="$(mktemp -d)"
          sdist_dir="$(mktemp -d)"
          unpack_dir="$(mktemp -d)"
          rebuilt_wheel_dir="$(mktemp -d)"

          python -m venv "$build_venv"
          "$build_venv/bin/python" -m pip install 'setuptools>=77,<78'
          "$build_venv/bin/python" - <<'PY'
          import setuptools

          major = int(setuptools.__version__.split(".", 1)[0])
          if major != 77:
              raise SystemExit(f"expected setuptools 77.x floor test, got {setuptools.__version__}")
          print(f"floor_setuptools={setuptools.__version__}")
          PY

          WHEEL_DIR="$wheel_dir" SDIST_DIR="$sdist_dir" "$build_venv/bin/python" - <<'PY'
          import os
          import pathlib
          import setuptools.build_meta as backend

          wheel_dir = pathlib.Path(os.environ["WHEEL_DIR"]).resolve()
          sdist_dir = pathlib.Path(os.environ["SDIST_DIR"]).resolve()
          wheel = backend.build_wheel(str(wheel_dir))
          sdist = backend.build_sdist(str(sdist_dir))
          print(wheel_dir / wheel)
          print(sdist_dir / sdist)
          PY

          test "$(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$sdist_dir" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          direct_wheel="$(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find "$sdist_dir" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          sha256sum "$direct_wheel" "$sdist"

          tar -xzf "$sdist" -C "$unpack_dir"
          source_root="$(find "$unpack_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          (
            cd "$source_root"
            REBUILT_WHEEL_DIR="$rebuilt_wheel_dir" "$build_venv/bin/python" - <<'PY'
          import os
          import pathlib
          import setuptools.build_meta as backend

          out_dir = pathlib.Path(os.environ["REBUILT_WHEEL_DIR"]).resolve()
          wheel = backend.build_wheel(str(out_dir))
          print(out_dir / wheel)
          PY
          )

          test "$(find "$rebuilt_wheel_dir" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          rebuilt_wheel="$(find "$rebuilt_wheel_dir" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sha256sum "$rebuilt_wheel"

          DIRECT_WHEEL="$direct_wheel" REBUILT_WHEEL="$rebuilt_wheel" "$build_venv/bin/python" - <<'PY'
          import email.parser
          import os
          import pathlib
          import zipfile

          direct = pathlib.Path(os.environ["DIRECT_WHEEL"])
          rebuilt = pathlib.Path(os.environ["REBUILT_WHEEL"])

          def read_payload(path):
              with zipfile.ZipFile(path) as archive:
                  return {
                      name: archive.read(name)
                      for name in sorted(archive.namelist())
                      if not name.endswith("/")
                  }

          direct_payload = read_payload(direct)
          rebuilt_payload = read_payload(rebuilt)
          if direct_payload != rebuilt_payload:
              raise SystemExit("setuptools 77.x direct and sdist-derived wheel payloads differ")

          metadata_names = [name for name in direct_payload if name.endswith(".dist-info/METADATA")]
          if len(metadata_names) != 1:
              raise SystemExit(f"expected one METADATA file, found {metadata_names}")
          metadata = email.parser.BytesParser().parsebytes(direct_payload[metadata_names[0]])
          expected = {
              "Name": "atlas-research-engine",
              "Version": "0.1.0",
              "Requires-Python": ">=3.10",
              "License-Expression": "MIT",
          }
          for field, value in expected.items():
              if metadata.get(field) != value:
                  raise SystemExit(
                      f"metadata drift at setuptools floor: {field}={metadata.get(field)!r}, expected {value!r}"
                  )
          print("PASS_BUILD_BACKEND_FLOOR")
          PY
