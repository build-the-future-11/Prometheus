name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          atlas init-run \
            --question "Does a preregistered treatment outperform a strong baseline?" \
            --output /tmp/atlas-smoke.json
          python -m json.tool /tmp/atlas-smoke.json >/dev/null
      - name: Benchmark Foundry smoke
        run: |
          atlas benchmark validate \
            --cases examples/benchmark/cases.jsonl \
            --manifest examples/benchmark/manifest.json
          atlas benchmark score \
            --cases examples/benchmark/cases.jsonl \
            --predictions examples/benchmark/predictions.jsonl \
            --output /tmp/atlas-benchmark-score.json
          python -m json.tool /tmp/atlas-benchmark-score.json >/dev/null
      - name: LAM-JEPA adapter dry-run smoke
        run: |
          python -m atlas.lam_jepa_adapter \
            --integration integrations/lam_jepa_arc_v3.json \
            --dry-run \
            > /tmp/lam-jepa-plan.json
          python -m json.tool /tmp/lam-jepa-plan.json >/dev/null
