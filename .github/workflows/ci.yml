name: prometheus-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prometheus-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout exact public source without submodule recursion or stored credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --filter=blob:none --depth=1 origin "$EXPECTED_SOURCE_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set scripts tests-infra .github NEUROGENESIS/successors/memory_v4/delivery NEUROGENESIS/scripts
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Infrastructure regression tests
        run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest tests-infra -q --junitxml=${{ runner.temp }}/infrastructure-tests.xml
      - name: Source completeness gate (must stay red while imports are missing)
        run: python scripts/audit_repository.py --output ${{ runner.temp }}/repository-audit.json
      - name: Retain integrity evidence even when the source gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-integrity
          path: |
            ${{ runner.temp }}/repository-audit.json
            ${{ runner.temp }}/infrastructure-tests.xml
          if-no-files-found: error
  projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: adaptive, project: AdaptivePredictive-ML}
          - {id: derived, project: Derived-Learning-ML}
          - {id: materials, project: 'ML4-Material Discovery'}
          - {id: neurogenesis, project: NEUROGENESIS}
          - {id: piml, project: PI-ML}
          - {id: sparking, project: SPARKING}
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PROJECT: ${{ matrix.project }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout exact project source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --filter=blob:none --depth=1 origin "$EXPECTED_SOURCE_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set "$PROJECT" scripts
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build, test, and verify sdist-derived wheel
        run: python scripts/check_project.py --project "$PROJECT" --output "${{ runner.temp }}/project-check"
      - name: Preserve logs and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: project-${{ matrix.id }}
          path: ${{ runner.temp }}/project-check
          if-no-files-found: error
  bounded-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GIT_TERMINAL_PROMPT: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONPATH: AdaptivePredictive-ML/src
    steps:
      - name: Checkout preserved reference and opt-in bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --filter=blob:none --depth=1 origin "$EXPECTED_SOURCE_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set AdaptivePredictive-ML
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install declared lightweight diagnostic dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<9'
      - name: Bounded-state regression tests
        run: python -m pytest AdaptivePredictive-ML/tests/test_bounded_state.py -q
      - name: Execute declared engineering matrix (not a predictive-success experiment)
        run: python AdaptivePredictive-ML/engineering/bounded_state_v1/run_equivalence.py --output "${{ runner.temp }}/bounded-equivalence"
      - name: Retain all engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-equivalence
          path: ${{ runner.temp }}/bounded-equivalence
          if-no-files-found: error
