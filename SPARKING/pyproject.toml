[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sparking-materials"
version = "0.1.0"
description = "Evidence-bound support-aware residual modeling for composition-only band-gap prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Ryan Gomez"}]
dependencies = [
  "catboost>=1.2.10,<1.3",
  "joblib>=1.4,<2",
  "matminer>=0.10.1,<0.11",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pymatgen>=2026.9.24,<2027",
  "scikit-learn>=1.5,<2",
  "scipy>=1.17,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
sparking = "sparking.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sparking"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

