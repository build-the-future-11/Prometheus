[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "adaptive-predictive-ml"
version = "0.1.0"
description = "Evidence-bound evaluation of drift-directed fixed-share online forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ryan"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4", "pandas>=2.1,<3", "scipy>=1.12,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
adaptive-predictive = "adaptive_predictive.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_predictive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

